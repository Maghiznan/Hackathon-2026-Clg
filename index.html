
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            background: #000;
        }

        body {
            background: #000;
        }

        .slide {
            width: 100%;
            height: 100vh;
            height: 100svh;
            display: flex;
            justify-content: center;
            align-items: center;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
            max-width: 100vw;
            max-height: 100vh;
            max-height: 100svh;
            width: auto;
            height: auto;
            object-fit: contain;
        }
    </style>
</head>

<body>

    <main id="presentation"></main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

        async function loadPresentation() {

            const pdf = await pdfjsLib.getDocument(
                "Syndicates.pdf"
            ).promise;

            const container = document.getElementById("presentation");

            for (let i = 1; i <= pdf.numPages; i++) {

                const page = await pdf.getPage(i);

                const original = page.getViewport({ scale: 1 });

                // Fit slide inside the screen without stretching
                const scale = Math.min(
                    window.innerWidth / original.width,
                    window.innerHeight / original.height
                );

                const viewport = page.getViewport({ scale });

                const dpr = window.devicePixelRatio || 1;

                const canvas = document.createElement("canvas");
                const context = canvas.getContext("2d");

                canvas.width = viewport.width * dpr;
                canvas.height = viewport.height * dpr;

                canvas.style.width = viewport.width + "px";
                canvas.style.height = viewport.height + "px";

                const slide = document.createElement("section");
                slide.className = "slide";

                slide.appendChild(canvas);
                container.appendChild(slide);

                await page.render({
                    canvasContext: context,
                    viewport: viewport,
                    transform: [dpr, 0, 0, dpr, 0, 0]
                }).promise;
            }
        }

        loadPresentation();

        // Keyboard navigation
        document.addEventListener("keydown", (e) => {
            const slides = document.querySelectorAll(".slide");

            const current = Math.round(
                window.scrollY / window.innerHeight
            );

            if (["ArrowDown", "PageDown", " "].includes(e.key)) {
                e.preventDefault();
                slides[Math.min(current + 1, slides.length - 1)]
                    ?.scrollIntoView({ behavior: "smooth" });
            }

            if (["ArrowUp", "PageUp"].includes(e.key)) {
                e.preventDefault();
                slides[Math.max(current - 1, 0)]
                    ?.scrollIntoView({ behavior: "smooth" });
            }
        });
    </script>

</body>
</html>
